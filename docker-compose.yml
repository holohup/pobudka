services:
  pobudka:
    build: .
    container_name: pobudka
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Home-level auth metadata persistence (Claude stores .claude.json here)
      - root-home:/root
      # CLI auth persistence
      - claude-auth:/root/.claude
      - codex-auth:/root/.codex
      # Credential-free quota publication (Kindle Dash mounts read-only)
      - usage-snapshots:/usage
      # State persistence (timer state fallback)
      - scheduler-state:/app/data

volumes:
  root-home:
  claude-auth:
  codex-auth:
  scheduler-state:
  usage-snapshots:
    name: pobudka-usage
